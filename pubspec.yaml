name: minik_kalpler
description: Minik Mümin — çocuklara yönelik İslami eğitim uygulaması. Tamamen offline çalışır.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  just_audio: ^0.9.40
  audioplayers: ^6.1.0
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/fonts/
    - assets/images/ui/
    - assets/images/dhikr/
    - assets/images/duas/
    - assets/images/home/
    - assets/images/ilmihal/
    - assets/images/morality/
    - assets/images/prayer/
    - assets/images/prophets/
    - assets/images/qissalar/
    - assets/images/quran/
    - assets/images/wudu/
    - assets/audio/asma/
    - assets/audio/duas/
    - assets/audio/effects/
    - assets/audio/prayer/
    - assets/audio/wudu/
    - assets/audio/dhikr/
    - assets/audio/quran/
    - assets/audio/quran/ayahs/
    - assets/audio/quran_learn/alphabet/
    - assets/audio/quran_learn/exercises/
    - assets/audio/quran_learn/harakat/
    - assets/audio/quran_learn/madd/
    - assets/audio/quran_learn/shadda/
    - assets/audio/quran_learn/sukun/
    - assets/audio/quran_learn/tanwin/
    - assets/audio/quran_learn/words/
    - assets/audio/quran_learn/surahs/
    - assets/audio/quran_learn/tajweed/
    - assets/images/elifba/
    - assets/images/elifba/characters/
    - assets/audio/elifba/exercises/
    - assets/audio/elifba/words/

  fonts:
    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic-Regular.ttf
    - family: Abay
      fonts:
        - asset: assets/fonts/KuranKerimFontAbay.ttf
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
